services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    command: --innodb_redo_log_capacity=2147483648
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pyspark-etl:
    build: process/
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./process/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: