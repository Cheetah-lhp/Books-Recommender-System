[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "books-recommender"
version = "0.1.0"
description = "Hybrid Goodreads modeling pipeline and Readora model-service adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<21",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
train = ["pyspark>=4.0,<4.3", "scikit-learn>=1.5,<2"]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pymysql>=1.1,<2",
  "python-dotenv>=1,<2",
]

[project.scripts]
books-recommender = "books_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: starts a local Spark session and exercises the pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
